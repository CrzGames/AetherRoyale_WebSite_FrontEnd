apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-aetherroyale-frontend-ingress
  namespace: prod-aetherroyale-frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aetherroyale.crzgames.com
      secretName: prod-aetherroyale-frontend-tls
  rules:
    - host: aetherroyale.crzgames.com
      http:
        paths:
          - pathType: Prefix
            path: '/'
            backend:
              service:
                name: prod-aetherroyale-frontend-service
                port:
                  number: 3000
